apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-ilm-bootstrap
  namespace: elastic-platform
  labels:
    app.kubernetes.io/name: elasticsearch-ilm-bootstrap
    app.kubernetes.io/part-of: elastic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "42"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-ilm-bootstrap
        app.kubernetes.io/part-of: elastic-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ilm-bootstrap
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              es_url="http://elasticsearch:9200"

              echo "Waiting for Elasticsearch readiness..."
              until curl -fsS "${es_url}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
                sleep 5
              done

              echo "Applying 3d data stream retention for APM streams (mapping-safe)"
              curl -fsS "${es_url}/_data_stream" 2>/dev/null | \
                grep -o '"name":"[^"]*"' | sed 's/"name":"//;s/"//' | \
                grep -E '^(logs-apm|traces-apm|metrics-apm)' | while read ds; do
                curl -fsS -X PUT "${es_url}/_data_stream/${ds}/_lifecycle" \
                  -H "Content-Type: application/json" \
                  -d '{"data_retention":"3d"}' >/dev/null 2>&1
              done || true

              echo "ILM bootstrap complete"